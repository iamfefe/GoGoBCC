<div id="toast" role="status"></div><script>// 題目依原始 PDF 逐頁核對；correct 為原始選項索引（0=A）。
const QUESTIONS = [
{id:1,topic:0,text:'電腦基本架構中有數個主要的組成單元（或部門），其中負責存放電腦程式與資料的單元是：',options:['算術與邏輯單元','輸入單元','記憶單元','控制單元'],correct:2,explain:'記憶單元（MU）負責儲存程式與資料，包含待處理、處理中與處理後的資料；算術邏輯單元負責運算，控制單元負責指揮。',hint:'「記」憶就是「記」住：程式、資料都住記憶庫。'},
{id:2,topic:0,text:'傑克將 iPhone 手機拍攝的照片轉存到電腦中，並列印出來與朋友分享。請問列印設備在電腦的五大單元中，是歸屬為下列哪一種單元？',options:['控制單元','輸入單元','輸出單元','記憶單元'],correct:2,explain:'印表機把電腦裡的資料變成紙上的照片，是把處理結果送到電腦外的輸出設備。題目問的是「列印設備」，不是手機傳照片的過程。',hint:'「印出」就是「輸出」；看到紙張印出來，答案跟著出來。'},
{id:3,topic:0,text:'下列對於電腦硬體五大單元的敘述何者有誤？',options:['輸入單元：待處理的資料須經由此單元進入電腦','輸出單元：處理完成之資料由此單元送出','算術邏輯單元：所有的算術運算均在此單元完成','記憶單元：僅儲存輸入待處理之資料'],correct:3,explain:'錯在「僅」字。記憶單元除了待處理的輸入資料，也存放程式、處理中的資料與處理結果。這題要選有誤的敘述。',hint:'記憶庫不挑客：程式、前、中、後，全都能記。看到「僅」先留意！'},
{id:4,topic:0,text:'在電腦的組成單元中，下列哪兩個單元合稱為中央處理單元？',options:['輸入單元及控制單元','控制單元及算術／邏輯單元','輸入單元及輸出單元','算術／邏輯單元及記憶單元'],correct:1,explain:'中央處理單元 CPU 的核心組成是控制單元 CU 與算術邏輯單元 ALU。記憶單元是五大單元之一，但不是這題 CPU 的兩個組成單元。',hint:'CPU 有兩位隊友：「控」場的指揮官＋「算」數的小高手。'},
{id:5,topic:0,text:'微軟公司在台灣成立了亞洲第一座「雲端運算」中心，以整合電腦的運算資源，來提供給國內各項創新研究計畫使用。一般而言，研究計畫都需要大量的運算，包括計算、比較、配對等不同的處理，請問電腦中負責這些運算工作的是下列哪一個單元？',options:['CU','MU','ALU','OU'],correct:2,explain:'ALU（Arithmetic Logic Unit）負責算術運算與邏輯判斷，所以計算、大小比較等都由它處理。CU 指揮、MU 儲存、OU 輸出。',hint:'ALU 是「愛邏輯、愛運算」的小高手：算一算、比一比，都找它。'},
{id:6,topic:0,text:'在「星際迷航記」影集中，船長寇克領導眾船員一同探索宇宙，當遇上危機時，船長便會指派船員完成各自的工作，並引導船員們脫離險境。請問若以船長扮演的角色來看，可比喻成電腦的哪一個單元最恰當？',options:['輸入單元','記憶單元','輸出單元','控制單元'],correct:3,explain:'船長負責下指令、協調工作，如同控制單元 CU 依程式指令協調電腦各單元運作。',hint:'船長「控」全場，控制單元也是總指揮。'},
{id:7,topic:0,text:'電腦的基本架構可分為五大單元，其中輸出單元（output unit）的功用為？',options:['接收使用者所輸入的資料','執行程式和處理資料','進行算術運算與邏輯運算','將資料輸出到顯示器或儲存媒體'],correct:3,explain:'輸出單元把處理結果送到顯示器、印表機或儲存媒體等。接收資料屬輸入，運算屬 ALU。依本題原始答案，選「將資料輸出到顯示器或儲存媒體」。',hint:'Output 的 out 是「外面」：結果向外送，就是輸出。'},
{id:8,topic:0,text:'加、減、乘、除是程式中常需進行的算術運算，請問在電腦中負責這些運算處理的是哪一個單元？',options:['算術邏輯單元','控制單元','輸出單元','輸入單元'],correct:0,explain:'加減乘除屬於算術運算，由算術邏輯單元 ALU 執行。控制單元負責協調，不親自做算術。',hint:'看到「算術」就找「算術邏輯」：名稱已把工作寫出來。'},
{id:9,topic:0,text:'請問電腦的五大單元，除了 IU、OU 之外，還包含哪些？',options:['CU、ALU、MU','CPU、ALU、MU','CPU、MU、CU','ALU、CU、CPU'],correct:0,explain:'五大單元是輸入 IU、輸出 OU、控制 CU、算術邏輯 ALU、記憶 MU。CPU 是 CU 與 ALU 的合稱，不能拿來另算一個單元。',hint:'「入、出、控、算、記」五兄弟；CPU 是控與算組成的隊名。'},
{id:10,topic:1,text:'下列有關電腦傳輸介面、連接埠的敘述，何者錯誤？',options:['利用 HDMI 可將畫面傳送至電視播放','利用 USB 可連接鍵盤','利用 RJ-45 可連接網路','利用音源輸入（line in）可連接外接式硬碟'],correct:3,explain:'Line in 是音訊輸入，不能用來傳輸硬碟資料。外接硬碟通常使用 USB 等資料介面。HDMI 可傳影音，RJ-45 常見於乙太網路。',hint:'Line in「聆音進」：進來的是聲音，不是硬碟資料。'},
{id:11,topic:0,text:'請問所謂的 I/O 指的是',options:['1 與 0','物聯網（IoT）','輸入與輸出','整合式辦公室系統（integrated office system）'],correct:2,explain:'I 是 Input（輸入），O 是 Output（輸出）。I/O 和數字 1、0 或物聯網 IoT 是不同概念。',hint:'I 想成 In「進來」，O 想成 Out「出去」：一進一出 I/O。'},
{id:12,topic:1,text:'關於「熱插拔」的敘述，何者為真？',options:['只能在開機的情況下插拔','只能在關機的情況下插拔','在關機及開機的情況下皆可插拔','只有當主機溫度高於一定溫度時才可插拔'],correct:2,explain:'支援熱插拔的介面可在電腦開機時連接或移除，關機時也可以；「熱」不是指溫度。儲存裝置移除前仍應完成寫入，並使用安全退出。',hint:'熱插拔＝「還在工作也能換」；冷熱都可插，寫完再拔它。'},
{id:13,topic:1,text:'阿布想要為自己的筆記型電腦擴充 2G 的 RAM，請問他應該將 RAM 安插在下列哪一種插槽？',options:['記憶體插槽','PCI-E 插槽','CPU 插槽','M.2 插槽'],correct:0,explain:'RAM 是隨機存取記憶體，應裝在相容的記憶體插槽。PCI-E 常用於擴充卡，CPU 插槽裝處理器，M.2 常見於 SSD 等裝置。部分筆電記憶體焊接，實際擴充需確認機型。',hint:'RAM 住「記憶體的房」；房客找對房，插槽不混裝。'},
{id:14,topic:1,text:'裕書的筆記型電腦內建有 Type C、HDMI、line out 等連接埠，下列為他使用連接埠的操作，請問何者不正確？',options:['利用 line out 連接埠來上網','利用 Type C 連接埠來為手機充電','利用 Type C 連接埠將手機中的資料傳送至電腦','利用 HDMI 連接埠將手機畫面傳送至電視播放'],correct:0,explain:'Line out 是音源輸出，連接喇叭等音訊設備，無法用來上網。Type-C 的實際充電、資料與影音能力需視裝置與線材支援；本題要找明顯錯誤的音源埠上網。',hint:'Out「嗷」一聲：喇叭有聲音；要上網，別找音源孔。'},
{id:15,topic:1,text:'電腦連接外部裝置的 USB 介面適合連接下列哪一種設備？',options:['電源供應器','隨身碟','RAM','CPU'],correct:1,explain:'隨身碟透過 USB 傳輸資料，是常見 USB 外接設備。一般 RAM、CPU 安裝在主機板相應插槽，不是 USB 外接裝置。',hint:'隨身碟隨身插，USB 就是它的家。'},

{id:17,topic:1,text:'下列連接埠中，何者無法用來傳輸視訊訊號？',options:['DVI','HDMI','RJ-45','VGA'],correct:2,explain:'依本題電腦常見連接埠分類，DVI、HDMI、VGA 是顯示介面；RJ-45 是常見網路接頭，不是直接接顯示器的視訊埠。網路可以承載編碼後的影片資料，與此分類不同。',hint:'DVI、HDMI、VGA「看畫面」；RJ-45「連網線」。'},
{id:18,topic:1,text:'小美買了新的喇叭，她應該要將喇叭接在什麼連接埠，才可以將電腦的聲音透過喇叭播放出來？',options:['line in','line out','mic in','mic out'],correct:1,explain:'喇叭要接收電腦送出的聲音，因此接 line out。Line in 接收外部音源，mic in 接收麥克風訊號。',hint:'聲音「出去」給喇叭：out 出，in 入。'},
{id:19,topic:1,text:'USB 是電腦、手機、相機等 3C 產品普遍使用的連接埠，有關 USB 的敘述，下列何者錯誤？',options:['USB 3.0、USB4 的插頭皆為 Type-C 規格','隨身碟上標示 USB 圖示，表示該隨身碟是使用 USB 與電腦連接','可作為週邊設備充電使用的連接埠','支援熱插拔'],correct:0,explain:'USB 3.0 是傳輸規格，不代表接頭一定是 Type-C，也有 Type-A 等接頭。USB4 採 Type-C，但不能因此說 USB 3.0、USB4 全都是 Type-C。「版本」與「外形」要分開記。原題 USB 圖示在此以文字標示。',hint:'版本像「車速」，Type 像「車型」；跑得快，不代表長得一樣。'}
