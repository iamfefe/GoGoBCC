<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ef"><meta name="description" content="GoGoBCC 數概複習：選項亂序、錯題解析與記憶口訣，一路練到 19 題全部答對。"><title>GoGoBCC</title><link rel="stylesheet" href="style.css"></head>
